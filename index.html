<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pawgress</title>
<meta name="theme-color" content="#f8f3ec">
<meta name="description" content="Pawgress: a cozy study companion by Moki and Mochi.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pawgress">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: soft, hand-drawn, quietly encouraging; a sticker sheet tucked in a study notebook
   IDEA: a felt-tip illustrated bedroom diorama that fills up as you study, beside a tidy planner page
   PICTURE: the room, drawn with warm brown ink outlines and pastel fills, with a chubby sticker companion
   COLOUR and TYPE: oat-paper cream, cocoa ink, pastel peach, butter, sage and sky; Quicksand (soft, rounded) for display, Nunito for text
   LAYOUT: room sticky on the left, notebook panel on the right; phones stack room (shrunk off the Focus tab) over panel */
:root{color-scheme:light dark;
--bg:light-dark(#f8f3ec,#1e1a19);--paper:light-dark(#fffdf9,#282321);--ink:light-dark(#4b3832,#f1e7de);--soft:light-dark(#8b7b73,#b8aaa1);
--line:light-dark(#eadfd3,#3d3532);--edge:light-dark(#4b3832,#cdbdb2);--chip:light-dark(#f4ece2,#332c29);
--peach:light-dark(#f6cdc4,#8e5a52);--butter:light-dark(#f8e6b3,#7a6a3e);--sage:light-dark(#d6e5cb,#4f6249);--sky:light-dark(#d4e3f1,#44566b);
--good:light-dark(#5c8a5f,#9fd2a3);--bad:light-dark(#c0604f,#ffa898);--wash:light-dark(#fbe9e3,#3a302d)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Nunito,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.digits{font-family:Quicksand,Nunito,sans-serif;font-weight:700;margin:0;line-height:1.1}
h3{font-size:18px;margin:24px 0 10px}
.wrap{max-width:1240px;margin:0 auto;padding:clamp(14px,2.6vw,32px) max(4vw,14px)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin-bottom:18px}
.brand{flex:1 1 auto;display:flex;align-items:center;gap:10px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font-size:clamp(25px,3vw,32px);letter-spacing:-.01em}
.brand small{display:block;font:600 14px Nunito,sans-serif;color:var(--soft)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:1.5px solid var(--line);border-radius:99px;padding:5px 14px;font-weight:700;white-space:nowrap}
.pill svg{width:18px;height:18px}
.grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;align-items:start}
.roomcol{position:sticky;top:16px}
@media(max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}.roomcol{position:static}.room.mini svg{height:190px}}
.room{position:relative;border-radius:26px;overflow:hidden;border:2px solid var(--edge);box-shadow:4px 5px 0 var(--line)}
.room svg{display:block;width:100%;height:auto}
.bubble{position:absolute;right:21%;top:11%;max-width:42%;background:var(--paper);color:var(--ink);padding:8px 14px;border:1.5px solid var(--edge);border-radius:18px 18px 4px 18px;font-weight:600;font-size:15px;line-height:1.4}
.room.mini .bubble{top:12px;left:auto;right:12px;max-width:55%}
@media(max-width:600px){.bubble{font-size:13px;right:20%;top:6%;max-width:52%;padding:6px 10px}}
.panel{background:var(--paper);border:1.5px solid var(--line);border-radius:26px;padding:16px clamp(14px,2.2vw,24px) 22px}
.tabs{display:flex;gap:2px;border-bottom:1.5px solid var(--line);margin:0 0 18px;overflow-x:auto}
.tabs button{flex:1 0 auto;border:0;background:none;color:var(--soft);font:700 14.5px Nunito,sans-serif;min-height:46px;padding:0 10px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1.5px}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:#eaa496}
.digits{font-size:clamp(56px,8vw,82px);font-weight:600;font-variant-numeric:tabular-nums;text-align:center;white-space:nowrap;letter-spacing:.01em}
.bar{height:12px;background:var(--chip);border:1.5px solid var(--line);border-radius:9px;overflow:hidden;margin:12px 0 6px}.bar i{display:block;height:100%;background:#f1a99b;border-radius:9px;transition:width .5s linear}
.muted{color:var(--soft);font-size:14px}.center{text-align:center}
label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
input,textarea{width:100%;font:16px Nunito,sans-serif;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:10px 13px;min-height:46px}
textarea{min-height:110px;resize:vertical}
input:focus-visible,button:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2.5px solid #eaa496;outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font:700 15px Nunito,sans-serif;min-height:44px;padding:0 16px;border-radius:99px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--butter);border-color:var(--edge)}
.chip.num{width:96px;padding:0 10px;text-align:center}
.btn{display:block;width:100%;border:1.5px solid var(--edge);border-radius:99px;min-height:50px;font:700 17px Quicksand,Nunito,sans-serif;cursor:pointer;margin-top:16px;background:var(--peach);color:var(--ink);box-shadow:0 3px 0 var(--edge);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.btn.ghost{background:var(--paper)}.btn.sm{min-height:44px;font-size:15.5px;margin-top:10px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 120px}
.link{border:0;background:none;color:var(--ink);text-decoration:underline;text-decoration-color:#eaa496;text-underline-offset:3px;text-decoration-thickness:2px;font:700 15px Nunito,sans-serif;cursor:pointer;padding:8px 0;min-height:40px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tile{border:1.5px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:3px;background:var(--bg);font:inherit;color:inherit;text-align:left}
.tile b{font-size:15px}.tile span{font-size:13px;color:var(--soft);flex:1}
.tile .buy{margin-top:8px;min-height:40px;border-radius:99px;border:1.5px solid var(--edge);font:700 14px Nunito,sans-serif;cursor:pointer;background:var(--peach);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:5px}
.tile .buy svg{width:15px;height:15px}.tile .buy:disabled{opacity:.45;cursor:not-allowed}.tile .buy.owned{background:var(--paper);border-color:var(--line)}
.tile.sel{border-color:var(--edge);background:var(--wash)}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px}
.pick button{border:1.5px solid transparent;background:none;border-radius:18px;padding:4px 2px 8px;cursor:pointer;color:var(--ink);font:700 13px Nunito,sans-serif}
.pick button:hover{background:var(--chip)}
.pick button[aria-pressed=true]{border-color:var(--edge);background:var(--wash)}
.stk{display:block;width:100%;height:auto;max-height:92px;filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 2px 3px rgba(75,56,50,.18))}
.ringwrap{text-align:center}.ring{width:min(320px,100%);height:auto;display:block;margin:0 auto}
.wash{fill:var(--wash);stroke:var(--line);stroke-width:1.5}
.arm{cursor:pointer;transition:transform .2s}.arm:hover{opacity:.85}
.breedname{font:700 20px Quicksand,sans-serif;margin:4px 0 2px}
.bgprev{display:block;width:100%;height:auto;border-radius:14px;margin-bottom:8px}
.bgtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.bgrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.bgrow b{font:700 16px Quicksand,sans-serif}.price{font-size:13px;color:var(--soft);white-space:nowrap}
.dotsrow{display:flex;gap:5px;margin:4px 0 2px}.dotsrow i{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{border:1.5px solid var(--line);border-radius:16px;padding:10px 6px;text-align:center}.stat:nth-child(3n+1){background:var(--wash)}.stat:nth-child(3n+2){background:color-mix(in srgb,var(--butter) 45%,transparent)}.stat:nth-child(3n){background:color-mix(in srgb,var(--sage) 55%,transparent)}
.stat b{display:block;font:700 24px Quicksand,sans-serif;white-space:nowrap}.stat span{font-size:13px;color:var(--soft)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end;height:150px;margin-top:6px}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:13px;color:var(--soft)}
.week i{display:block;width:70%;max-width:34px;background:var(--peach);border:1.5px solid var(--edge);border-radius:10px 10px 4px 4px;min-height:4px}
.week b{font-size:13px;color:var(--ink)}
.hbar{display:grid;grid-template-columns:minmax(0,7em) minmax(0,1fr) auto;gap:8px;align-items:center;font-size:14px;margin:7px 0}
.hbar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hbar i{display:block;height:12px;background:var(--sky);border:1.5px solid var(--edge);border-radius:7px}.hbar b{white-space:nowrap}
ul.list{list-style:none;padding:0;margin:8px 0 0}
ul.list li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1.5px dashed var(--line);font-size:15px}
ul.list li .s{flex:1;overflow:hidden;text-overflow:ellipsis}
ul.list li .m{white-space:nowrap;font-weight:700}
.x{border:0;background:none;color:var(--soft);font-size:20px;width:40px;height:40px;border-radius:10px;cursor:pointer;flex:none}
.check{width:28px;height:28px;border-radius:50%;border:1.8px solid var(--edge);background:none;cursor:pointer;flex:none;display:grid;place-items:center;color:var(--ink);font-weight:800;font-size:14px}
.check.on{background:var(--sage)}
.done .s{text-decoration:line-through;color:var(--soft)}
.tag{display:inline-block;background:var(--sky);border-radius:99px;padding:0 9px;font-size:12px;font-weight:700;margin-left:6px;white-space:nowrap;color:var(--ink)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.days button{border:1.5px solid var(--line);background:var(--bg);border-radius:16px;padding:6px 2px;cursor:pointer;color:var(--ink);font:600 12px Nunito,sans-serif;min-height:62px}
.days button b{display:block;font:700 19px Quicksand,sans-serif}
.days button[aria-pressed=true]{background:var(--butter);border-color:var(--edge)}
.dots{display:block;height:8px;font-size:10px;line-height:8px;letter-spacing:1px;color:#e58f80}
.flash{perspective:1000px;margin:12px 0}
.flash .in{position:relative;min-height:210px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.flash.f .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;display:grid;place-items:center;padding:20px;text-align:center;font:700 22px/1.3 Quicksand,sans-serif;background:var(--paper);border:1.5px solid var(--edge);box-shadow:3px 4px 0 var(--line);overflow:auto}
.face.back{transform:rotateY(180deg);background:var(--wash);font:600 18px/1.45 Nunito,sans-serif}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:600 16px/1.35 Nunito,sans-serif;padding:12px 15px;border-radius:16px;margin-top:8px;cursor:pointer;min-height:48px}
.opt:hover:not(:disabled){border-color:var(--edge)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.q{font:700 20px/1.35 Quicksand,sans-serif;margin:8px 0 4px}
.fb{margin-top:12px;padding:12px 14px;border-radius:16px;font-weight:700}
.fb.ok{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}.fb.no{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
.mast{height:8px;background:var(--chip);border-radius:6px;overflow:hidden;margin-top:6px}.mast i{display:block;height:100%;background:var(--good)}
.boxdots{white-space:nowrap;color:var(--good);letter-spacing:2px;font-size:12px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;background:var(--paper);color:var(--ink);border:1.5px solid var(--edge);box-shadow:0 3px 0 var(--edge);font:700 16px Quicksand,sans-serif;padding:11px 22px;border-radius:99px;transition:.35s;pointer-events:none;white-space:nowrap;z-index:60}
.toast.on{opacity:1;transform:translate(-50%,0)}
.foot{margin-top:14px;font-size:13px;color:var(--soft);text-align:center}
details summary{cursor:pointer;font-weight:700;padding:8px 0;min-height:40px}
/* welcome */
.welcome{position:fixed;inset:0;z-index:50;overflow:auto;display:grid;place-items:center;padding:24px;background:var(--bg);transition:opacity .6s}
.welcome.out{opacity:0;pointer-events:none}
.wcard{width:min(560px,100%);text-align:center;position:relative}
.wcard h2{font-size:clamp(38px,7.5vw,60px);font-weight:700;letter-spacing:-.015em;line-height:1.05;text-wrap:balance}
.wcard h2 em{font-style:normal;color:#e08c7c}
.wcard .by{font:600 17px Nunito,sans-serif;color:var(--soft);margin-top:10px}
.wcard .hero{width:min(330px,82%);height:auto;margin:0 auto 10px;display:block}
.paws{display:none}
/* scene */
.dim{fill:#140f22;opacity:0}
:root[data-theme=dark] .dim{opacity:.3}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .dim{opacity:.3}}
.bob{animation:bob 4.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.steam{animation:steam 3s ease-in-out infinite;opacity:.7}@keyframes steam{50%{transform:translateY(-6px);opacity:.15}}
.tw{animation:tw 2.6s ease-in-out infinite}@keyframes tw{50%{opacity:.4}}
.zz{animation:zz 3s ease-in-out infinite}@keyframes zz{0%{opacity:0;transform:translate(0,6px)}50%{opacity:1}100%{opacity:0;transform:translate(8px,-14px)}}
.hop{animation:hop .6s ease 3}@keyframes hop{50%{transform:translateY(-14px)}}
.spark{animation:spark 1.6s ease-out forwards}@keyframes spark{to{transform:translateY(-40px);opacity:0}}
.fall{animation:fall linear infinite}@keyframes fall{from{transform:translate(0,-30px)}to{transform:translate(-14px,170px)}}
.floaty{animation:bob 3.4s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.bob,.eye,.steam,.tw,.zz,.hop,.spark,.fall,.floaty{animation:none}.toast,.bar i,.flash .in,.welcome,.btn{transition:none}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18.5" fill="#f6cdc4" stroke="#4b3832" stroke-width="2"/><g fill="#fffdf9" stroke="#4b3832" stroke-width="1.6"><ellipse cx="20" cy="25" rx="7.5" ry="6.5"/><circle cx="11.5" cy="17" r="3.4"/><circle cx="17" cy="12" r="3.4"/><circle cx="23" cy="12" r="3.4"/><circle cx="28.5" cy="17" r="3.4"/></g></svg><div><h1>Pawgress</h1><small id="sub">Mochi’s room</small></div></div>
    <span class="pill" title="Acorns"><svg viewBox="0 0 24 24"><path d="M5 10c0-3 3-5 7-5s7 2 7 5z" fill="#8a5a3b"/><path d="M12 5V2" stroke="#8a5a3b" stroke-width="2" stroke-linecap="round"/><path d="M6 10h12c0 6-3 10-6 11-3-1-6-5-6-11z" fill="#d9965b"/></svg><span id="acorns">0</span></span>
    <span class="pill" id="streakPill">0 day streak</span>
  </header>
  <div class="grid">
    <div class="roomcol"><div class="room" id="room"><svg id="scene" viewBox="0 0 600 360" role="img" aria-label="Your companion's room"></svg><div class="bubble" id="bubble">Hi!</div></div></div>
    <section class="panel">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="focus">Focus</button><button role="tab" data-tab="plan">Planner</button><button role="tab" data-tab="cards">Cards</button><button role="tab" data-tab="stats">Stats</button><button role="tab" data-tab="style">Customize</button>
      </div>
      <div id="view"></div>
    </section>
  </div>
  <p class="foot" id="sync">Your progress is saved on this device.</p>
</div>
<div class="toast" id="toast"></div>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const shade=(h,a)=>{const n=parseInt(h.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const t=a<0?0:255,k=Math.abs(a);r=Math.round(r+(t-r)*k);g=Math.round(g+(t-g)*k);b=Math.round(b+(t-b)*k);return'#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1)};
const ACORN='<svg viewBox="0 0 24 24"><path d="M5 10c0-3 3-5 7-5s7 2 7 5z" fill="#8a5a3b"/><path d="M6 10h12c0 6-3 10-6 11-3-1-6-5-6-11z" fill="#e3a66c"/></svg>';
const PAW='<svg viewBox="0 0 40 40"><ellipse cx="20" cy="26" rx="9" ry="8"/><circle cx="9" cy="16" r="4"/><circle cx="16" cy="9" r="4"/><circle cx="24" cy="9" r="4"/><circle cx="31" cy="16" r="4"/></svg>';

/* ---------- companion art: outlined chibi stickers ---------- */

const SP={
 cat:{label:'Cat',name:'Mochi',ears:'cat',tail:'cat',mouth:'cat',br:[
  {n:'Orange tabby',b:'#f6c88f',f:'#fbe6c8',p:'tabby',pc:'#e5a05a'},
  {n:'Calico',b:CREAM,p:'calico',pc:'#efae66',pc2:'#4f4549'},
  {n:'Tuxedo',b:'#4a4450',p:'tux',pc:CREAM,paw:CREAM},
  {n:'Siamese',b:'#f4e8d8',p:'points',pc:'#7a5c52',paw:'#7a5c52',e:'#7a5c52'},
  {n:'Grey tabby',b:'#c6c5cd',f:'#ebeaf0',p:'tabby',pc:'#96949f'},
  {n:'Snow white',b:CREAM}]},
 dog:{label:'Dog',name:'Moki',ears:'flop',tail:'dog',mouth:'dog',br:[
  {n:'Shiba',b:'#eeb877',p:'mask',pc:CREAM},
  {n:'Dalmatian',b:CREAM,p:'spots',pc:'#4f4549',e:'#4f4549'},
  {n:'Golden',b:'#f3cf91',f:'#fae6c3',e:'#e3ae68'},
  {n:'Beagle',b:CREAM,p:'beagle',pc:'#c78c55',e:'#a8703f',paw:CREAM},
  {n:'Husky',b:'#a9adb8',p:'mask',pc:'#fbf9f6',e:'#8e929e'},
  {n:'Pug',b:'#efd9b4',p:'pug',pc:'#4f4549',e:'#4f4549'},
  {n:'Spotty',b:'#f1eeea',p:'spots',pc:'#8f8a92',e:'#8f8a92'}]},
 bunny:{label:'Bunny',name:'Pip',ears:'bunny',tail:'puff',mouth:'cat',br:[
  {n:'Snowball',b:CREAM},{n:'Strawberry',b:'#f6cfcf',f:'#fbe4e1'},{n:'Dutch',b:CREAM,p:'dutch',pc:'#9c7a68',e:'#9c7a68'},{n:'Dove grey',b:'#cfccd4',f:'#eceaf0'}]},
 bear:{label:'Bear',name:'Bram',ears:'round',mouth:'bear',br:[
  {n:'Cocoa',b:'#9b7562',f:'#dcbca5'},{n:'Honey',b:'#e3b07a',f:'#f6dcb8'},{n:'Polar',b:CREAM,f:'#f3ece2'},{n:'Black bear',b:'#4f4549',f:'#c2a68f'}]},
 hamster:{label:'Hamster',name:'Nugget',ears:'tiny',mouth:'cat',puff:true,br:[

  <button class="link" style="color:var(--bad);margin-top:10px" data-act="delDeck">${delArm===d.id?'Tap again to delete this deck':'Delete deck'}</button>`}
 if(cv.mode==='flash'){if(F.i>=F.order.length)return `<h2 class="center" style="margin-top:8px">Round done!</h2><p class="center">${F.got} got it · ${F.miss} still learning</p><div class="row"><button class="btn" data-act="flash">Go again</button><button class="btn ghost" data-act="backDeck">Back to deck</button></div>`;
  const c=d.cards.find(x=>x.id===F.order[F.i]);if(!c){F.i++;return vCards()}
  return `<button class="link" data-act="backDeck">‹ ${esc(d.name)}</button><p class="muted">Card ${F.i+1} of ${F.order.length} · tap to flip</p><div class="flash ${F.flipped?'f':''}"><div class="in" data-act="flip" role="button" tabindex="0" aria-label="Flip card"><div class="face">${esc(c.q)}</div><div class="face back">${esc(c.a)}</div></div></div>${F.flipped?`<div class="row"><button class="btn ghost" data-act="fc" data-v="0">Still learning</button><button class="btn" data-act="fc" data-v="1">Got it</button></div>`:`<button class="btn ghost" data-act="flip">Show answer</button>`}`}
 if(cv.mode==='test'){const q=T.qs[T.i],a=T.ans;let body='';
  if(q.type==='write')body=`<form data-form="write"><input id="wIn" autocomplete="off" placeholder="Type the term" ${a?'disabled':''} value="${a?esc(a.picked):''}"><button class="btn sm" type="submit" ${a?'disabled':''}>Check</button></form>`;
  else body=q.options.map((o,i)=>{let c='';if(a){if(o===q.answer)c='right';else if(i===a.idx)c='wrong'}return `<button class="opt ${c}" data-act="pick" data-v="${i}" ${a?'disabled':''}>${esc(o)}</button>`}).join('');
  const fb=a?`<div class="fb ${a.ok?'ok':'no'}">${a.ok?'Correct!':'Not quite. Answer: '+esc(q.type==='tf'?(q.truth?'True':'False')+' — '+q.card.q+' means “'+q.card.a+'”':q.answer)}${!a.ok&&q.type==='write'?`<br><button class="link" data-act="override">I was right, count it</button>`:''}</div><button class="btn" data-act="next">${T.i+1<T.qs.length?'Next question':'See results'}</button>`:'';
  return `<button class="link" data-act="backDeck">‹ Quit test</button><p class="muted">Question ${T.i+1} of ${T.qs.length} · ${T.correct} correct</p><div class="bar"><i style="width:${(T.i/T.qs.length*100).toFixed(0)}%"></i></div><p class="q">${q.prompt}</p>${body}${fb}`}
 if(cv.mode==='result'){const pct=Math.round(T.correct/T.qs.length*100);
  return `<h2 class="center" style="font-size:52px;margin-top:6px">${pct}%</h2><p class="center">${T.correct} of ${T.qs.length} correct · +${T.earned} acorns</p>${T.missed.length?`<h3>Review these</h3><ul class="list">${T.missed.map(c=>`<li><span class="s"><b>${esc(c.q)}</b><br><span class="muted">${esc(c.a)}</span></span></li>`).join('')}</ul>`:'<p class="center">Perfect score. Wow!</p>'}<div class="row"><button class="btn" data-act="test">New test</button><button class="btn ghost" data-act="backDeck">Back to deck</button></div>`}
 return ''}
function makeTest(d){const cards=shuffle(d.cards).sort((a,b)=>(a.box||0)-(b.box||0)).slice(0,Math.min(10,d.cards.length));const types=['mc','mcr','tf','write'];
 return shuffle(cards).map((c,i)=>{let type=types[(i+Math.floor(Math.random()*4))%4];if(type==='write'&&c.q.length>40)type='mc';const others=shuffle(d.cards.filter(x=>x.id!==c.id));
  if(type==='mc'){const opts=[...new Set([c.a,...others.map(x=>x.a)])].slice(0,4);return{type,card:c,prompt:`What does <b>${esc(c.q)}</b> mean?`,answer:c.a,options:shuffle(opts)}}
  if(type==='mcr'){const opts=[...new Set([c.q,...others.map(x=>x.q)])].slice(0,4);return{type,card:c,prompt:`Which term matches: “${esc(c.a)}”?`,answer:c.q,options:shuffle(opts)}}
  if(type==='tf'){const truth=Math.random()<.5||!others.length,shown=truth?c.a:others[0].a;return{type,card:c,truth,prompt:`True or false: <b>${esc(c.q)}</b> means “${esc(shown)}”`,answer:truth?'True':'False',options:['True','False']}}
  return{type,card:c,prompt:`Type the term for: “${esc(c.a)}”`,answer:c.q}})}
const clean=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function answer(ok,extra){const q=T.qs[T.i];T.ans=Object.assign({ok},extra);if(ok){T.correct++;q.card.box=Math.min(5,(q.card.box||0)+1);say(['Nice!','You know this one.','Yes! Keep going.'][T.i%3])}else{q.card.box=0;T.missed.push(q.card);say('Almost. We’ll see it again.')}save();renderView()}

function say(t){lineAt=now();$('#bubble').textContent=t}

function chime(){try{if(!audio)return;const t=audio.currentTime;[523.25,659.25,783.99].forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.setValueAtTime(0,t+i*.18);g.gain.linearRampToValueAtTime(.16,t+i*.18+.02);g.gain.exponentialRampToValueAtTime(.001,t+i*.18+1.2);o.connect(g).connect(audio.destination);o.start(t+i*.18);o.stop(t+i*.18+1.3)})}catch(e){}}
function earn(n,msg){if(n<=0)return;S.acorns+=n;happyUntil=now()+3200;toast(`+${n} acorn${n>1?'s':''}${msg?' · '+msg:''}`)}
function logSession(min,subject,src,done){const earned=reward(min,done);S.sessions.push({id:uid(),at:now(),min,subject:subject||'',src,earned});if(S.sessions.length>500)S.sessions=S.sessions.slice(-500);earn(earned);return earned}
function finish(done){const r=S.run;if(!r)return;S.run=null;
 if(r.kind==='break'){say('Break’s over. Ready for another round?');offerBreak=false;chime()}
 else{const mm=done?r.dur:Math.floor((r.dur*60000-(r.paused!=null?r.paused:Math.max(0,r.endAt-now())))/60000);
  if(mm>=5){const e=logSession(mm,r.subject,'timer',done);chime();say(done?`We did it! ${mm} minutes. +${e} acorns.`:`${mm} minutes counts. +${e} acorns.`);offerBreak=true}else say('That’s okay. We can try again anytime.')}

/* ---------- welcome ---------- */
function welcome(){if(S.welcomed)return;let step=1,sp=S.species;const w=document.createElement('div');w.className='welcome';w.setAttribute('role','dialog');w.setAttribute('aria-label','Welcome to Pawgress');
 const paws=`<div class="paws">${[[6,12,-20],[14,70,15],[84,18,25],[90,64,-10],[46,88,5],[70,40,30]].map(([x,y,r])=>`<span style="position:absolute;left:${x}%;top:${y}%;transform:rotate(${r}deg)">${PAW}</span>`).join('')}</div>`;
 const draw=()=>{w.innerHTML=paws+(step===1?`<div class="wcard"><svg class="hero" viewBox="0 0 360 360" aria-hidden="true"><defs><clipPath id="heroclip"><circle cx="180" cy="180" r="176"/></clipPath></defs><g clip-path="url(#heroclip)"><circle cx="180" cy="180" r="104" class="wash"/>${[['cat',0],['dog',1],['cat',1],['dog',0],['cat',2],['dog',6],['cat',3],['dog',3]].map(([k,i],n)=>`<g transform="translate(180 180) rotate(${n*45+22.5}) translate(0 -128)">${pawArm(k,i)}</g>`).join('')}</g><g class="floaty"><g transform="translate(138 246) scale(.72)">${animal({sp:'cat',ci:0,mood:'happy'})}</g><g transform="translate(224 246) scale(.72)">${animal({sp:'dog',ci:0,mood:'idle'})}</g><path d="M181 140c-5 -8 -16 -5 -14 5c2 7 14 14 14 14s12 -7 14 -14c2 -10 -9 -13 -14 -5z" fill="#f3a89a" stroke="#4b3832" stroke-width="2.4" stroke-linejoin="round"/></g></svg><h2>Welcome to <em>Pawgress</em></h2><p class="by">by Moki and Mochi</p><p class="muted" style="max-width:380px;margin:16px auto 0">A cozy study companion. Focus together, plan your week, practice with study cards, and decorate your buddy’s room as you go.</p><button class="btn" data-w="next" style="max-width:320px;margin:26px auto 0">Get started</button></div>`
  :`<div class="wcard"><h2 style="font-size:clamp(30px,5vw,42px)">Choose your study buddy</h2><p class="by" style="margin-bottom:18px">You can change this anytime in Customize.</p><div class="pick">${Object.keys(SP).map(k=>`<button data-w="sp" data-v="${k}" aria-pressed="${sp===k}">${mini(k,0)}${SP[k].label}</button>`).join('')}</div><label for="wName" style="text-align:left">Name your buddy</label><input id="wName" maxlength="20" value="${esc(SP[sp].name)}"><button class="btn" data-w="done">Enter Pawgress</button></div>`)};
 w.addEventListener('click',e=>{const b=e.target.closest('[data-w]');if(!b)return;const k=b.dataset.w;
  if(k==='next'){step=2;draw()}else if(k==='sp'){const cur=w.querySelector('#wName').value.trim();const was=SP[sp].name;sp=b.dataset.v;draw();w.querySelector('#wName').value=(!cur||cur===was)?SP[sp].name:cur}
  else if(k==='done'){S.species=sp;S.ci=0;S.name=w.querySelector('#wName').value.trim().slice(0,20)||SP[sp].name;S.welcomed=true;save();renderAll();say(`Hi! I’m ${buddyName()}. Let’s study together.`);w.classList.add('out');setTimeout(()=>w.remove(),650)}});
 draw();document.body.appendChild(w)}

/* ---------- loop ---------- */
function tick(){const r=S.run;if(r&&r.paused==null&&remaining()<=0){finish(true);return}
 const c=$('#clock');if(c&&r){const left=remaining();c.textContent=fmt(left);const p=$('#prog');if(p)p.style.width=(100-left/(r.dur*60000)*100).toFixed(1)+'%'}
 const m=computeMood(),n=isNight();if(m!==mood||n!==lastNight){lastNight=n;mood=m;scene()}
 if(now()-lineAt>90000){const L=m==='focus'?LINES.focus:m==='sleep'?[LINES.sleep]:LINES.idle;say(L[Math.floor(Math.random()*L.length)])}}
setInterval(tick,500);
if(S.run&&S.run.paused==null&&remaining()<=0)finish(true);
renderAll();say(S.run?LINES.focus[1]:isNight()?LINES.sleep:`Hi! I’m ${buddyName()}. Ready when you are.`);welcome();

/* ---------- account sync ---------- */
(async()=>{try{if(!window.claude||!window.claude.use)return;const db=await window.claude.use('db'),u=await window.claude.use('user');if(!db||!u)return;const id=await u.id();if(!id)return;
 const r=db.doc('data/users/'+id+'/companion');const snap=await r.get();ref=r;const remote=snap.exists?snap.data():null;
 if(remote&&remote.state&&(remote.state.updated||0)>(S.updated||0)){const wasWelcome=!S.welcomed;S=norm(JSON.parse(JSON.stringify(remote.state)));try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}renderAll();if(S.welcomed&&wasWelcome){const w=document.querySelector('.welcome');if(w)w.remove()}}else if(S.updated)flush();
 $('#sync').textContent='Progress is saved to your account, so it follows you to other devices.'}catch(e){ref=null}})();
}
</script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))</script>
</body>
</html>
